substitutions:
  node_name: "cn105-lr"
  friendly_name: "CN105 LR"
  hard_version: "2.0"
  soft_version: "1.1"
  remote_temp_sensor: sensor.ac_main_floor_control_temperature

esphome:
  name: ${node_name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: arduino

uart:
  id: hp_uart
  baud_rate: 2400
  rx_pin: GPIO20
  tx_pin: GPIO21

external_components:
  - source: github://echavet/MitsubishiCN105ESPHome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret fallback_ap_password
  reboot_timeout: 30s

captive_portal:

logger:
  level: INFO

api:

ota:
  - platform: esphome

web_server:
  port: 80

time:
  - platform: homeassistant
    id: homeassistant_time

sensor:
  - platform: uptime
    name: "Uptime"

  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 120s

  - platform: homeassistant
    name: "Remote Temperature Sensor"
    entity_id: ${remote_temp_sensor}
    internal: false
    disabled_by_default: false
    device_class: temperature
    state_class: measurement
    unit_of_measurement: "C"
    filters:
      - clamp:
          min_value: 1
          max_value: 40
          ignore_out_of_range: true
      - throttle: 30s
    on_value:
      then:
        - logger.log:
            level: INFO
            format: "Remote temperature received from HA: %.1f C"
            args: [ "x" ]
        - lambda: "id(hp).set_remote_temperature(x);"

text_sensor:
  - platform: version
    name: "ESPHome Version"

  - platform: wifi_info
    ip_address:
      name: "IP"
    ssid:
      name: "SSID"
    bssid:
      name: "BSSID"

  - platform: template
    name: "Hardware Version"
    lambda: 'return {"${hard_version}"};'
    update_interval: 60s

  - platform: template
    name: "Software Version"
    lambda: 'return {"${soft_version}"};'
    update_interval: 60s

button:
  - platform: restart
    name: "Restart"

climate:
  - platform: cn105
    id: hp
    name: "AC"
    icon: mdi:heat-pump
    visual:
      min_temperature: 10
      max_temperature: 31
      temperature_step:
        target_temperature: 1
        current_temperature: 0.5
    fahrenheit_compatibility: "disabled"
    remote_temperature_timeout: 30min
    remote_temperature_keepalive_interval: 20s
    update_interval: 2s
    debounce_delay: 100ms
    compressor_frequency_sensor:
      name: "Compressor Frequency"
      entity_category: diagnostic
      disabled_by_default: false
    outside_air_temperature_sensor:
      name: "Outside Air Temp"
      disabled_by_default: true
    vertical_vane_select:
      name: "Vertical Vane"
      disabled_by_default: false
    horizontal_vane_select:
      name: "Horizontal Vane"
      disabled_by_default: true
    isee_sensor:
      name: "ISEE Sensor"
      disabled_by_default: true
    stage_sensor:
      name: "Stage"
      entity_category: diagnostic
      disabled_by_default: true
    sub_mode_sensor:
      name: "Sub Mode"
      entity_category: diagnostic
      disabled_by_default: true
    auto_sub_mode_sensor:
      name: "Auto Sub Mode"
      entity_category: diagnostic
      disabled_by_default: true
    input_power_sensor:
      name: "Input Power"
      disabled_by_default: true
    kwh_sensor:
      name: "Energy Usage"
      disabled_by_default: true
    runtime_hours_sensor:
      name: "Runtime Hours"
      entity_category: diagnostic
      disabled_by_default: true
